
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KURDTOK</title>

<style>
:root {
 --bg:#100e17;
 --panel:#201c2b;
 --text:#fff;
 --muted:#aaa2b5;
 --accent:#9865ff;
 --border:#393143;
}
body.light {
 --bg:#f5f2fa;
 --panel:#fff;
 --text:#21182d;
 --muted:#777080;
 --accent:#7545d5;
 --border:#e5dfed;
}
* {box-sizing:border-box}
body {
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
}
header {
 position:sticky;
 top:0;
 z-index:5;
 background:var(--panel);
 border-bottom:1px solid var(--border);
 padding:14px;
 display:flex;
 align-items:center;
 justify-content:space-between;
}
.logo {
 color:var(--accent);
 font-size:25px;
 font-weight:900;
}
button {
 border:0;
 border-radius:12px;
 padding:11px 15px;
 background:var(--accent);
 color:white;
 cursor:pointer;
 font-size:15px;
}
button:disabled {opacity:.5}
main {
 max-width:620px;
 margin:auto;
 padding:14px 12px 100px;
}
.panel {
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:16px;
 padding:16px;
 margin-bottom:16px;
}
input,textarea {
 display:block;
 width:100%;
 padding:13px;
 margin:10px 0;
 border:1px solid var(--border);
 border-radius:11px;
 background:var(--bg);
 color:var(--text);
 font-size:16px;
}
textarea {min-height:75px}
nav {
 position:fixed;
 bottom:0;
 right:0;
 left:0;
 z-index:10;
 display:flex;
 justify-content:space-around;
 background:var(--panel);
 border-top:1px solid var(--border);
 padding:10px 2px;
}
nav button {
 background:transparent;
 color:var(--text);
 padding:8px 5px;
 font-size:13px;
}
.page {display:none}
.page.active {display:block}
.post {
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:16px;
 overflow:hidden;
 margin-bottom:18px;
}
.post video {
 width:100%;
 max-height:520px;
 background:#000;
 display:block;
}
.post-info {padding:14px}
.muted {color:var(--muted)}
.row {
 display:flex;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
}
.row button {margin-top:5px}
.status {
 padding:10px;
 border-radius:10px;
 margin:10px 0;
 background:var(--bg);
 color:var(--muted);
}
.hidden {display:none!important}
h2 {font-size:21px}
small {color:var(--muted)}
</style>
</head>

<body>

<header>
 <div class="logo">KURDTOK 💜</div>
 <button id="themeBtn">☀️ / 🌙</button>
</header>

<main>

<!-- FEED -->
<section id="home" class="page active">
 <h2>🎬 ڤیدیۆکان</h2>
 <div id="feedStatus" class="status">
   چاوەڕێ بکە...
 </div>
 <div id="feed"></div>
</section>

<!-- SEARCH -->
<section id="search" class="page">
 <div class="panel">
  <h2>🔎 گەڕان</h2>
  <input id="searchInput" placeholder="ناوی بەکارهێنەر یان دەق...">
  <div id="searchResult"></div>
 </div>
</section>

<!-- UPLOAD -->
<section id="upload" class="page">
 <div class="panel">
  <h2>➕ بارکردنی ڤیدیۆ</h2>
  <p class="muted">سەرەتا دەبێت بچیتە ژوورەوە.</p>
  <input id="videoFile" type="file"
    accept="video/mp4,video/webm,video/quicktime">
  <textarea id="caption"
    maxlength="300"
    placeholder="دەربارەی ڤیدیۆکەت بنووسە..."></textarea>
  <button id="uploadBtn">بڵاوکردنەوە 🚀</button>
  <div id="uploadStatus" class="status">
    ڤیدیۆیەک هەڵبژێرە.
  </div>
 </div>
</section>

<!-- PROFILE -->
<section id="profile" class="page">
 <div class="panel">
  <h2>👤 پرۆفایل</h2>
  <div id="profileInfo">میوان</div>
  <div id="authArea">
   <h3>دروستکردنی هەژمار</h3>
   <input id="email" type="email"
     placeholder="ئیمەیڵ">
   <input id="password" type="password"
     placeholder="وشەی نهێنی">
   <button id="signupBtn">دروستکردنی هەژمار</button>
   <button id="loginBtn">چوونەژوورەوە</button>
  </div>
  <button id="logoutBtn" class="hidden">
    چوونەدەرەوە
  </button>
  <div id="authStatus" class="status"></div>
 </div>
</section>

<!-- NOTIFICATIONS -->
<section id="notifications" class="page">
 <div class="panel">
  <h2>🔔 ئاگاداری</h2>
  <p>سیستەمی ئاگاداری لە قۆناغی داهاتوودا زیاد دەکرێت.</p>
 </div>
</section>

</main>

<nav>
 <button onclick="showPage('home')">🏠<br>سەرەتا</button>
 <button onclick="showPage('search')">🔎<br>گەڕان</button>
 <button onclick="showPage('upload')">➕<br>بارکردن</button>
 <button onclick="showPage('notifications')">🔔<br>ئاگاداری</button>
 <button onclick="showPage('profile')">👤<br>پرۆفایل</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ---------------------------------
// SUPABASE SETTINGS
// ---------------------------------

const SUPABASE_URL =
 "https://xfddtkzvndevankhcgjr.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_Aq_ekEY3pK0CUV_iycNUuQ_zkE337Mz";

const client = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentUser = null;
let allVideos = [];

// ---------------------------------
// PAGE NAVIGATION
// ---------------------------------

function showPage(id) {
 document.querySelectorAll(".page").forEach(page => {
  page.classList.remove("active");
 });
 document.getElementById(id).classList.add("active");
}

// ---------------------------------
// THEME
// ---------------------------------

document.getElementById("themeBtn").onclick = () => {
 document.body.classList.toggle("light");
};

// ---------------------------------
// AUTH
// ---------------------------------

async function updateUser() {
 const {data,error} = await client.auth.getUser();

 currentUser = error ? null : data.user;

 document.getElementById("authArea")
  .classList.toggle("hidden",!!currentUser);

 document.getElementById("logoutBtn")
  .classList.toggle("hidden",!currentUser);

 document.getElementById("profileInfo").textContent =
  currentUser ? currentUser.email : "بەکارهێنەری میوان";
}

document.getElementById("signupBtn").onclick =
 async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || password.length < 8) {
   return authMessage("ئیمەیڵ بنووسە و وشەی نهێنی لانیکەم ٨ پیت بێت.");
  }

  const {data,error} = await client.auth.signUp({
   email,password
  });

  if(error) return authMessage(error.message);

  if(data.session) {
   await updateUser();
   authMessage("هەژمارەکەت دروست بوو!");
  } else {
   authMessage("ئیمەیڵەکەت بپشکنە بۆ پشتڕاستکردنەوە.");
  }
 };

document.getElementById("loginBtn").onclick =
 async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const {error} = await client.auth.signInWithPassword({
   email,password
  });

  if(error) return authMessage(error.message);

  await updateUser();
  authMessage("بە سەرکەوتوویی چوویتە ژوورەوە.");
  await loadFeed();
 };

document.getElementById("logoutBtn").onclick =
 async () => {
  const {error} = await client.auth.signOut();

  if(error) return authMessage(error.message);

  await updateUser();
  authMessage("چوویتە دەرەوە.");
 };

function authMessage(message) {
 document.getElementById("authStatus").textContent = message;
}

// ---------------------------------
// VIDEO UPLOAD
// ---------------------------------

document.getElementById("uploadBtn").onclick =
 async () => {

  const status = document.getElementById("uploadStatus");
  const button = document.getElementById("uploadBtn");
  const file = document.getElementById("videoFile").files[0];
  const caption = document.getElementById("caption").value.trim();

  if(!currentUser) {
   status.textContent = "سەرەتا بچۆ ژوورەوە.";
   return;
  }

  if(!file) {
   status.textContent = "تکایە ڤیدیۆیەک هەڵبژێرە.";
   return;
  }

  if(!file.type.startsWith("video/")) {
   status.textContent = "تەنها فایلە ڤیدیۆییەکان ڕێگەپێدراون.";
   return;
  }

  if(file.size > 50 * 1024 * 1024) {
   status.textContent = "قەبارەی ڤیدیۆ نابێت لە ٥٠ مێگابایت زیاتر بێت.";
   return;
  }

  button.disabled = true;
  status.textContent = "ڤیدیۆکە بار دەکرێت...";

  try {
   const extension =
    file.name.split(".").pop().toLowerCase();

   const filePath =
    currentUser.id + "/" +
    Date.now() + "." + extension;

   const {error:uploadError} =
    await client.storage
     .from("videos")
     .upload(filePath,file,{
      contentType:file.type,
      upsert:false
     });

   if(uploadError) throw uploadError;

   const {error:dbError} =
    await client.from("videos").insert({
     user_id:currentUser.id,
     caption:caption,
     storage_path:filePath
    });

   if(dbError) {
    await client.storage.from("videos").remove([filePath]);
    throw dbError;
   }

   status.textContent = "ڤیدیۆکەت بە سەرکەوتوویی بڵاوکرایەوە! 💜";

   document.getElementById("videoFile").value = "";
   document.getElementById("caption").value = "";

   await loadFeed();
   showPage("home");

  } catch(error) {
   status.textContent = "هەڵە: " + error.message;
  }

  button.disabled = false;
 };

// ---------------------------------
// LOAD VIDEO FEED
// ---------------------------------

async function loadFeed() {
 const feed = document.getElementById("feed");
 const status = document.getElementById("feedStatus");

 feed.innerHTML = "";
 status.textContent = "ڤیدیۆکان بار دەکرێن...";

 const {data,error} = await client
  .from("videos")
  .select("*")
  .order("created_at",{ascending:false});

 if(error) {
  status.textContent = "هەڵە لە وەرگرتنی ڤیدیۆکان: " + error.message;
  return;
 }

 allVideos = data || [];

 if(allVideos.length === 0) {
  status.textContent = "هێشتا هیچ ڤیدیۆیەک بڵاونەکراوەتەوە.";
  return;
 }

 status.textContent = allVideos.length + " ڤیدیۆ";

 for(const video of allVideos) {
  const {data:urlData,error:urlError} =
   await client.storage
    .from("videos")
    .createSignedUrl(video.storage_path,3600);

  if(urlError) continue;

  const post = document.createElement("article");
  post.className = "post";

  const player = document.createElement("video");
  player.src = urlData.signedUrl;
  player.controls = true;
  player.playsInline = true;
  player.preload = "metadata";

  const info = document.createElement("div");
  info.className = "post-info";

  const caption = document.createElement("p");
  caption.textContent = video.caption || "ڤیدیۆیەکی نوێ";

  const user = document.createElement("small");
  user.textContent = "بەکارهێنەر: " +
   video.user_id.slice(0,8);

  info.appendChild(caption);
  info.appendChild(user);
  post.appendChild(player);
  post.appendChild(info);
  feed.appendChild(post);
 }
}

// ---------------------------------
// SEARCH
// ---------------------------------

document.getElementById("searchInput").oninput =
 event => {
  const term = event.target.value.toLowerCase();

  const results = allVideos.filter(video =>
   (video.caption || "").toLowerCase().includes(term)
  );

  const area = document.getElementById("searchResult");
  area.innerHTML = "";

  results.forEach(video => {
   const item = document.createElement("p");
   item.textContent = video.caption || "ڤیدیۆ";
   area.appendChild(item);
  });

  if(results.length === 0) {
   area.textContent = "هیچ ئەنجامێک نەدۆزرایەوە.";
  }
 };

// ---------------------------------
// START APP
// ---------------------------------

async function startApp() {
 await updateUser();
 await loadFeed();
}

startApp();

</script>
</body>
</html>
