
<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>KurdTok</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif}
header{background:#171717;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-size:29px;font-weight:bold;color:#ff3155}
.logo span{color:white}
main{max-width:650px;margin:auto;padding:15px}
.card{background:#191919;border:1px solid #333;border-radius:16px;padding:17px;margin-bottom:15px}
input,textarea{width:100%;padding:13px;margin:7px 0;background:#292929;border:1px solid #444;color:white;border-radius:10px}
button{padding:12px;border:0;border-radius:10px;background:#ff3155;color:white;cursor:pointer;font-weight:bold}
button.secondary{background:#333;color:white}
button:disabled{opacity:.5}
.full{width:100%;margin:6px 0}
.hidden{display:none!important}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tabs button{flex:1}
.video{width:100%;max-height:500px;background:black;border-radius:12px}
.small{color:#aaa;font-size:13px}
.bottom{position:sticky;bottom:0;background:#171717;display:flex;justify-content:space-around;padding:10px}
.bottom button{background:transparent}
.avatar{width:65px;height:65px;border-radius:50%;background:#ff3155;margin:auto;display:grid;place-items:center;font-size:30px}
#authStatus,#uploadStatus{color:#ff9bad;font-size:13px}
.post-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.post-actions button{background:#333}
</style>
</head>
<body>

<header>
 <div class="logo">Kurd<span>Tok</span></div>
 <button class="secondary" id="logout" hidden>دەرچوون</button>
</header>

<main>
<section id="auth">
 <div class="card">
  <div class="logo" style="text-align:center;font-size:50px">K</div>
  <h2 style="text-align:center">بەخێربێیت بۆ KurdTok ❤️</h2>
  <p class="small" style="text-align:center">جیهانی ڤیدیۆی کوردی</p>

  <div class="tabs">
   <button id="signupTab">ئەکاونتی نوێ</button>
   <button class="secondary" id="loginTab">چوونەژوورەوە</button>
  </div>

  <div id="signupForm">
   <input id="regName" placeholder="ناوی خۆت">
   <input id="regEmail" type="email" placeholder="ئیمەیڵ">
   <input id="regPass" type="password" placeholder="پاسۆرد - لانیکەم 6 پیت">
   <button class="full" id="signup">دروستکردنی ئەکاونت</button>
  </div>

  <div id="loginForm" class="hidden">
   <input id="email" type="email" placeholder="ئیمەیڵ">
   <input id="pass" type="password" placeholder="پاسۆرد">
   <button class="full" id="login">چوونەژوورەوە</button>
   <button class="secondary full" id="reset">بیرخستنەوەی پاسۆرد</button>
  </div>

  <hr style="border-color:#333">
  <input id="guestName" placeholder="ناوی خۆت بۆ چوونەژوورەوە وەک میوان">
  <button class="secondary full" id="guest">چوونەژوورەوە وەک میوان</button>
  <p id="authStatus"></p>
 </div>
</section>

<section id="app" class="hidden">
 <div class="tabs">
  <button data-page="feed">🏠 سەرەتا</button>
  <button data-page="upload">➕ ڤیدیۆ</button>
  <button data-page="profile">👤 پڕۆفایل</button>
 </div>

 <section id="feedPage">
  <div class="card">
   <h3>🎬 KurdTok For You</h3>
   <p class="small">ڤیدیۆکانی کوردستان</p>
  </div>
  <div id="posts">بارکردن...</div>
 </section>

 <section id="uploadPage" class="hidden">
  <div class="card">
   <h2>➕ بارکردنی ڤیدیۆ</h2>
   <input id="file" type="file" accept="video/*">
   <textarea id="caption" placeholder="دەربارەی ڤیدیۆکەت بنووسە..."></textarea>
   <button class="full" id="upload">بڵاوکردنەوە</button>
   <progress id="progress" max="100" value="0" style="width:100%"></progress>
   <p id="uploadStatus"></p>
  </div>
 </section>

 <section id="profilePage" class="hidden">
  <div class="card" style="text-align:center">
   <div class="avatar">K</div>
   <h2 id="userName"></h2>
   <p id="userEmail" class="small"></p>
   <p id="userType" class="small"></p>
   <button class="secondary" id="profileLogout">چوونەدەرەوە</button>
  </div>
 </section>
</section>
</main>

<nav class="bottom hidden" id="bottom">
 <button data-page="feed">🏠<br>سەرەتا</button>
 <button data-page="upload">➕<br>ڤیدیۆ</button>
 <button data-page="profile">👤<br>پڕۆفایل</button>
</nav>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

import {
getAuth,createUserWithEmailAndPassword,
signInWithEmailAndPassword,signInAnonymously,
onAuthStateChanged,signOut,sendPasswordResetEmail,
updateProfile
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

import {
getFirestore,doc,setDoc,getDoc,collection,
addDoc,getDocs,query,orderBy,limit,
serverTimestamp,deleteDoc
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

import {
getStorage,ref,uploadBytesResumable,getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-storage.js";

// FIREBASE CONFIG - YOUR PROJECT
const firebaseConfig={
apiKey:"AIzaSyCq9l5BbPhyXDv4AWITe-R_Mg6jLoQf0C4",
authDomain:"aizasy-2e889.firebaseapp.com",
projectId:"aizasy-2e889",
storageBucket:"aizasy-2e889.firebasestorage.app",
messagingSenderId:"503323472309",
appId:"1:503323472309:web:4ce8fd5b24585899dd29fc",
measurementId:"G-E64YRW9ENL"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);

const $=id=>document.getElementById(id);
let user=null;

function msg(id,text){$(id).textContent=text}

// AUTH TABS
$("signupTab").onclick=()=>{
$("signupForm").classList.remove("hidden");
$("loginForm").classList.add("hidden");
};

$("loginTab").onclick=()=>{
$("loginForm").classList.remove("hidden");
$("signupForm").classList.add("hidden");
};

// CREATE ACCOUNT
$("signup").onclick=async()=>{
const name=$("regName").value.trim();
const email=$("regEmail").value.trim();
const password=$("regPass").value;

if(!name||!email||password.length<6){
msg("authStatus","تکایە هەموو زانیارییەکان پڕبکەرەوە.");
return;
}

try{
const result=await createUserWithEmailAndPassword(auth,email,password);
await updateProfile(result.user,{displayName:name});

await setDoc(doc(db,"users",result.user.uid),{
name,email,guest:false,
createdAt:serverTimestamp()
});

msg("authStatus","ئەکاونتەکەت دروست کرا ❤️");
}catch(e){msg("authStatus",e.message)}
};

// LOGIN
$("login").onclick=async()=>{
try{
await signInWithEmailAndPassword(auth,
$("email").value.trim(),$("pass").value);
}catch(e){msg("authStatus","ئیمەیڵ یان پاسۆرد هەڵەیە")}
};

// GUEST
$("guest").onclick=async()=>{
const name=$("guestName").value.trim();
if(!name){msg("authStatus","ناوت بنووسە");return}

try{
const result=await signInAnonymously(auth);
await updateProfile(result.user,{displayName:name});

await setDoc(doc(db,"users",result.user.uid),{
name,guest:true,createdAt:serverTimestamp()
});
}catch(e){msg("authStatus",e.message)}
};

// PASSWORD RESET
$("reset").onclick=async()=>{
const email=$("email").value.trim();
if(!email){msg("authStatus","ئیمەیڵ بنووسە");return}

try{
await sendPasswordResetEmail(auth,email);
msg("authStatus","لینکی گۆڕینی پاسۆرد نێردرا");
}catch(e){msg("authStatus",e.message)}
};

// AUTH SESSION
onAuthStateChanged(auth,async u=>{
user=u;

if(u){
$("auth").classList.add("hidden");
$("app").classList.remove("hidden");
$("bottom").classList.remove("hidden");
$("logout").hidden=false;

let name=u.displayName||"Guest";
let guest=false;

try{
const p=await getDoc(doc(db,"users",u.uid));
if(p.exists()){
name=p.data().name||name;
guest=p.data().guest===true;
}
}catch(e){}

$("userName").textContent=name;
$("userEmail").textContent=u.email||"";
$("userType").textContent=guest?"میوان":"بەکارهێنەر";

loadPosts();
}else{
$("auth").classList.remove("hidden");
$("app").classList.add("hidden");
$("bottom").classList.add("hidden");
$("logout").hidden=true;
}
});

// LOGOUT
$("logout").onclick=()=>signOut(auth);
$("profileLogout").onclick=()=>signOut(auth);

// NAVIGATION
function page(name){
["feed","upload","profile"].forEach(p=>{
$(p+"Page").classList.toggle("hidden",p!==name);
});
}
document.querySelectorAll("[data-page]").forEach(b=>{
b.onclick=()=>page(b.dataset.page);
});

// UPLOAD VIDEO
$("upload").onclick=async()=>{
const file=$("file").files[0];
if(!user||!file){
msg("uploadStatus","ڤیدیۆیەک هەڵبژێرە.");
return;
}

if(!file.type.startsWith("video/")){
msg("uploadStatus","فایلی ڤیدیۆ هەڵبژێرە.");
return;
}

if(file.size>100*1024*1024){
msg("uploadStatus","قەبارەی ڤیدیۆ نابێت لە 100MB زیاتر بێت.");
return;
}

$("upload").disabled=true;

try{
const path="videos/"+user.uid+"/"+Date.now();
const task=uploadBytesResumable(ref(storage,path),file);

task.on("state_changed",s=>{
$("progress").value=s.bytesTransferred/s.totalBytes*100;
msg("uploadStatus","بارکردن...");
},e=>{
msg("uploadStatus",e.message);
$("upload").disabled=false;
},async()=>{
try{
const url=await getDownloadURL(task.snapshot.ref);

await addDoc(collection(db,"posts"),{
uid:user.uid,
name:user.displayName||"Guest",
caption:$("caption").value.trim(),
videoUrl:url,
createdAt:serverTimestamp()
});

msg("uploadStatus","ڤیدیۆکەت بڵاوکرایەوە ❤️");
$("file").value="";
$("caption").value="";
$("progress").value=0;
page("feed");
await loadPosts();
}catch(e){msg("uploadStatus",e.message)}
$("upload").disabled=false;
});
}catch(e){
msg("uploadStatus",e.message);
$("upload").disabled=false;
}
};

// LOAD VIDEOS
async function loadPosts(){
const container=$("posts");
container.textContent="بارکردنی ڤیدیۆکان...";

try{
const q=query(collection(db,"posts"),
orderBy("createdAt","desc"),limit(30));

const snapshot=await getDocs(q);
container.replaceChildren();

if(snapshot.empty){
container.textContent="هێشتا ڤیدیۆ نییە. یەکەم ڤیدیۆ بڵاو بکەرەوە!";
return;
}

for(const item of snapshot.docs){
const d=item.data();
const card=document.createElement("div");
card.className="card";

const title=document.createElement("h3");
title.textContent="👤 "+(d.name||"KurdTok");

const video=document.createElement("video");
video.className="video";
video.src=d.videoUrl;
video.controls=true;
video.playsInline=true;
video.preload="metadata";

const caption=document.createElement("p");
caption.textContent=d.caption||"";

const actions=document.createElement("div");
actions.className="post-actions";

const like=document.createElement("button");
like.textContent="❤️ لایک";

const comments=document.createElement("button");
comments.textContent="💬 کۆمێنت";

const share=document.createElement("button");
share.textContent="↗ هاوبەشکردن";

like.onclick=()=>toggleLike(item.id,like);
comments.onclick=()=>commentPost(item.id);

share.onclick=async()=>{
try{
await navigator.clipboard.writeText(location.href+"#"+item.id);
alert("لینک کۆپی کرا");
}catch(e){alert("نەتوانرا لینک کۆپی بکرێت")}
};

actions.append(like,comments,share);
card.append(title,video,caption,actions);
container.append(card);
}
}catch(e){
container.textContent="هەڵە: "+e.message;
}
}

// LIKES
async function toggleLike(postId,button){
try{
const r=doc(db,"posts",postId,"likes",user.uid);
const existing=await getDoc(r);

if(existing.exists()){
await deleteDoc(r);
button.textContent="❤️ لایک";
}else{
await setDoc(r,{
uid:user.uid,createdAt:serverTimestamp()
});
button.textContent="❤️ لایک کرا";
}
}catch(e){alert(e.message)}
}

// COMMENTS
async function commentPost(postId){
const text=prompt("کۆمێنتەکەت بنووسە:");
if(!text||!text.trim())return;

try{
await addDoc(collection(db,"posts",postId,"comments"),{
uid:user.uid,
name:user.displayName||"Guest",
text:text.trim(),
createdAt:serverTimestamp()
});
alert("کۆمێنت نێردرا ❤️");
}catch(e){alert(e.message)}
}

</script>
</body>
</html>
